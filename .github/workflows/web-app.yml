name: web_app

# Each application is installed, checked and tested from its own directory with its own frozen
# lockfile, exactly as AGENTS.md prescribes for local work.
on:
  pull_request:
    paths: ["web_app/**", ".github/workflows/web-app.yml"]
  push:
    branches: [main]
    paths: ["web_app/**", ".github/workflows/web-app.yml"]

permissions:
  contents: read

concurrency:
  group: web-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web_app/frontend
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web_app/frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web_app/frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      # A production build requires the API address; CI builds against a placeholder.
      - run: pnpm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.ci.invalid/api
      - run: pnpm audit --prod --audit-level high

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web_app/backend
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web_app/backend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web_app/backend/pnpm-lock.yaml
      # The suites start their own disposable PostgreSQL 18 clusters (tests/database/cluster.mjs).
      - name: Install PostgreSQL 18 binaries
        working-directory: .
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -yq postgresql-18
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run db:check
      - run: pnpm test
      - run: pnpm run test:database
