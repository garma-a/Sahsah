name: sahsah_mobile
description: Sahsah iOS and Android application starter.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.3.0
  http: ^1.2.2
  lucide_icons_flutter: ^4.0.2
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  wakelock_plus: ^1.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/img/
    - assets/game/
    - assets/logo/
  fonts:
    - family: Lalezar
      fonts:
        - asset: assets/fonts/Lalezar-Regular.ttf
    - family: ReadexPro
      fonts:
        - asset: assets/fonts/ReadexPro-Light.ttf
          weight: 300
        - asset: assets/fonts/ReadexPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/ReadexPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/ReadexPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ReadexPro-Bold.ttf
          weight: 700
    - family: ReemKufi
      fonts:
        - asset: assets/fonts/ReemKufi-Medium.ttf
          weight: 500
        - asset: assets/fonts/ReemKufi-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ReemKufi-Bold.ttf
          weight: 700
